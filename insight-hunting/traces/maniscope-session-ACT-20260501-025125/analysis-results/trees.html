    header {

    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .controls { display: grid; grid-template-columns: minmax(260px, 1fr) 260px 160px; gap: 10px; margin-top: 14px; align-items: center; }
    input[type="search"], select, button { min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; }

    button { padding: 0 11px; cursor: pointer; }
    button:hover { border-color: #9fb0c6; }
    main { max-width: none; padding: 22px 24px 48px; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }

    .overview h2, .legend-panel h2 { margin: 0 0 8px; font-size: 15px; }
    .legend-panel .legend-subtitle { margin-top: 12px; }
    .overview p { margin: 0; color: #334155; }
    .legend-grid { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(260px, 420px); gap: 12px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; font-weight: 700; }
    .legend-cell { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 2px 8px; font-size: 12px; color: #334155; }
    .dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
    .relation-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .forest { margin-top: 24px; }

    .forest-title h2 { margin: 0; font-size: 18px; }
    .forest-title span { color: var(--muted); font-size: 13px; }
    .tree { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); margin: 14px 0 22px; overflow: clip; }
    .tree-header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fbfdff; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .tree-header strong { display: block; overflow-wrap: anywhere; }
    .tree-header .note { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .tree-body { padding: 12px 14px 18px; }

      $('continuedSummary').textContent = DATA.continuedSummary || 'No continued investigation summary embedded.';
      const filter = $('forestFilter');
      for (const config of forestConfigs) {
        const option = document.createElement('option');
        option.value = config.key;
        option.textContent = config.title;
        filter.append(option);
      }
    }

    function collectStats() {
      const countNodes = (forest) => (forest.trees || []).reduce((sum, tree) => sum + (tree.nodes || []).length, 0);
      return [
        ['User trees', (DATA.userForest.trees || []).length],
        ['Plan trees', (DATA.recommendationForest.trees || []).length],
        ['Augmented trees', (DATA.augmentedUserForest.trees || []).length],
        ['Adjacent trees', (DATA.adjacentExecutedForest.trees || []).length],
        ['Patch nodes', patchNodeIds.size],
        ['User nodes', countNodes(DATA.userForest)],
        ['Plan nodes', countNodes(DATA.recommendationForest)],
        ['Augmented nodes', countNodes(DATA.augmentedUserForest)],
        ['Adjacent nodes', countNodes(DATA.adjacentExecutedForest)],
        ['Patch ops', (DATA.patch.operations || []).length]
      ];
    }
    function renderSummary() {
      const box = $('summary'); box.replaceChildren();
      for (const [label, value] of collectStats()) {
        const card = make('div', 'metric');
        card.append(make('div', 'value', value));
        card.append(make('div', 'label', label));
        box.append(card);
      }
    }
    function chip(kind) { const c = make('span', 'chip'); const d = make('span', 'dot'); d.style.background = kindColors[kind] || '#94a3b8'; c.append(d, document.createTextNode(kind)); return c; }
    function renderLegends() {
      const rows = { Low: {}, Mid: {}, High: {} };
      for (const { tree } of allForests()) for (const node of tree.nodes || []) {
        const f = fullNode(node);
        let scope = f.scope || node.scope;
        let space = f.space || node.space;
        if (space === 'Intention') space = 'Intention Space';
        if (space === 'Action') space = 'Action Space';
        if (space === 'Finding') space = 'Finding Space';
        if (!scope || !space) [scope, space] = kindLegendDefaults[node.kind] || [];
        if (rows[scope] && space) {
          rows[scope][space] = rows[scope][space] || new Set();
          rows[scope][space].add(node.kind);
        }
      }
      const tbody = $('nodeLegend'); tbody.replaceChildren();
      for (const scope of ['Low','Mid','High']) {
        const tr = document.createElement('tr'); tr.append(make('th', '', scope));
        for (const space of ['Intention Space','Action Space','Finding Space']) {
          const td = document.createElement('td'); const wrap = make('div', 'legend-cell');
          const kinds = Array.from(rows[scope][space] || []).sort();
          if (!kinds.length) wrap.append(make('span', 'chip', '-')); else kinds.forEach((kind) => wrap.append(chip(kind)));
          td.append(wrap); tr.append(td);
        }
        tbody.append(tr);
      }
      const planBox = $('planScaffoldLegend'); planBox.replaceChildren();
      ['SourceNode','ReasoningGap','ExpansionRationale','ExpectedFinding'].forEach((kind) => planBox.append(chip(kind)));
      const rels = new Set();
      for (const { tree } of allForests()) for (const edge of tree.edges || []) if (edge.relation) rels.add(edge.relation);
      const relBox = $('relationLegend'); relBox.replaceChildren();
      Array.from(rels).sort().forEach((rel) => { const c = chip(rel); c.querySelector('.dot').style.background = relationColors[rel] || '#94a3b8'; relBox.append(c); });
    }

    function searchText(node) {
      const f = fullNode(node);
      return [node.instanceId, node.canonicalId, node.parentInstanceId, node.relationToParent, f.kind, f.space, f.scope, f.label, f.confidence, f.provenance, f.actor, f.source, f.planRef && JSON.stringify(f.planRef), f.explanation, f.evidenceSummary, f.reasoningRole, f.patchRationale, f.targetContext, f.analyticContrast, f.searchConcepts, f.decisionCriteria, f.falsificationCriteria].flat().map(text).join(' ').toLowerCase();
    }
    function buildTree(tree) {
      const map = new Map();
      for (const node of tree.nodes || []) map.set(node.instanceId, Object.assign({}, node, { children: [] }));
      for (const node of map.values()) if (node.parentInstanceId && map.has(node.parentInstanceId)) map.get(node.parentInstanceId).children.push(node);
      return map.get(tree.root) || Array.from(map.values()).find((node) => !node.parentInstanceId) || null;
    }
    function markMatches(node, query) {
      const self = Boolean(query && searchText(node).includes(query));
      let child = false;
      for (const c of node.children || []) if (markMatches(c, query)) child = true;
      node.__match = self; node.__context = Boolean(query && child);
      return self || child;
    }
    function layout(root) {
      const nodes = [], edges = []; let leaf = 0, maxDepth = 0;
      function walk(node, depth) {
        node.__depth = depth; maxDepth = Math.max(maxDepth, depth);
        for (const child of node.children || []) walk(child, depth + 1);
        if ((node.children || []).length) node.__y = node.children.reduce((sum, c) => sum + c.__y, 0) / node.children.length;
        else { node.__y = MARGIN_Y + leaf * ROW_GAP; leaf += 1; }
        node.__x = MARGIN_X + depth * LEVEL_GAP; nodes.push(node);
        for (const child of node.children || []) edges.push({ source: node, target: child, relation: child.relationToParent || 'contains' });
      }
      walk(root, 0);
      return { nodes, edges, width: MARGIN_X * 2 + maxDepth * LEVEL_GAP + NODE_W, height: Math.max(280, MARGIN_Y * 2 + Math.max(leaf - 1, 0) * ROW_GAP + NODE_H) };
    }
    function renderEdge(svg, edge) {
      const x1 = edge.source.__x + NODE_W, y1 = edge.source.__y + NODE_H / 2, x2 = edge.target.__x, y2 = edge.target.__y + NODE_H / 2;
      const mid = Math.max(70, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + mid) + ' ' + y1 + ', ' + (x2 - mid) + ' ' + y2 + ', ' + x2 + ' ' + y2);
      path.setAttribute('class', 'edge' + ((edge.source.__match || edge.source.__context || edge.target.__match || edge.target.__context) ? ' match-edge' : ''));
      path.style.stroke = relationColors[edge.relation] || '#94a3b8';
      svg.append(path);
    }
    function renderNode(node, treeId, canvas) {
      const f = fullNode(node); const patch = isPatch(node);
      const btn = make('button', 'node kind-' + clean(f.kind || node.kind) + (patch ? ' patch' : '') + (node.__match ? ' match' : '') + (node.__context ? ' context' : ''));
      btn.type = 'button'; btn.dataset.id = node.instanceId; btn.style.left = node.__x + 'px'; btn.style.top = node.__y + 'px'; btn.style.borderTopColor = kindColors[f.kind || node.kind] || '#94a3b8';
      const top = make('div', 'node-topline'); top.append(make('span', 'node-id', node.canonicalId || node.instanceId), make('span', 'node-kind', f.kind || node.kind || 'Node'));
      if (patch) top.append(make('span', 'patch-badge', 'Patch'));
      btn.append(top, make('div', 'node-label', f.label || node.label || node.instanceId));
      btn.addEventListener('click', () => { state.selected[treeId] = node.instanceId; canvas.querySelectorAll('.node.selected').forEach((n) => n.classList.remove('selected')); btn.classList.add('selected'); openModal(node, btn); });
      return btn;
    }
    function clampZoom(z) { z = Number(z); return Number.isFinite(z) ? Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)) : 1; }
    function treeZoom(id) { return clampZoom(state.zoom[id] || 1); }
    function applyZoom(id, z, parts, opts = {}) {
      const old = treeZoom(id), next = clampZoom(z), vp = parts.viewport;
      let vx = vp.clientWidth / 2, vy = vp.clientHeight / 2, lx = 0, ly = 0;
      if (opts.point) { const r = vp.getBoundingClientRect(); vx = opts.clientX - r.left; vy = opts.clientY - r.top; lx = (vp.scrollLeft + vx) / old; ly = (vp.scrollTop + vy) / old; }
      state.zoom[id] = next; parts.space.style.width = Math.ceil(parts.layout.width * next) + 'px'; parts.space.style.height = Math.ceil(parts.layout.height * next) + 'px'; parts.canvas.style.transform = 'scale(' + next + ')'; parts.value.textContent = Math.round(next * 100) + '%';
      if (opts.point) { vp.scrollLeft = lx * next - vx; vp.scrollTop = ly * next - vy; }
    }
    function fitZoom(parts) {
      const wz = Math.max(1, parts.viewport.clientWidth - 18) / parts.layout.width;
      const hz = Math.max(1, parts.viewport.clientHeight - 18) / parts.layout.height;
      return clampZoom(Math.min(1, parts.layout.width <= parts.layout.height ? wz : hz));
    }
    function addZoomTools(treeId, viewport, space, canvas, lay) {
      const tools = make('div', 'tree-tools'); const controls = make('div', 'zoom-controls');
      const out = make('button', '', '-'), value = make('span', 'zoom-value', '100%'), reset = make('button', '', 'Fit'), one = make('button', '', '100%'), inn = make('button', '', '+');
      const parts = { viewport, space, canvas, layout: lay, value };
      out.addEventListener('click', () => applyZoom(treeId, treeZoom(treeId) - ZOOM_STEP, parts));
      inn.addEventListener('click', () => applyZoom(treeId, treeZoom(treeId) + ZOOM_STEP, parts));
      one.addEventListener('click', () => applyZoom(treeId, 1, parts));
      reset.addEventListener('click', () => applyZoom(treeId, fitZoom(parts), parts));
      viewport.addEventListener('wheel', (event) => { if (!event.metaKey && !event.ctrlKey) return; event.preventDefault(); applyZoom(treeId, treeZoom(treeId) * Math.exp(-event.deltaY * 0.002), parts, { point: true, clientX: event.clientX, clientY: event.clientY }); }, { passive: false });
      let start = 1; viewport.addEventListener('gesturestart', (event) => { event.preventDefault(); start = treeZoom(treeId); }, { passive: false });
      viewport.addEventListener('gesturechange', (event) => { event.preventDefault(); applyZoom(treeId, start * event.scale, parts, { point: true, clientX: event.clientX, clientY: event.clientY }); }, { passive: false });
      controls.append(out, value, reset, one, inn); tools.append(controls, make('span', 'subtitle', 'Zoom with buttons, trackpad pinch, or Cmd/Ctrl + scroll.'));
      requestAnimationFrame(() => applyZoom(treeId, fitZoom(parts), parts));
      return tools;
    }
    function renderTree(config, tree) {
      const root = buildTree(tree); if (!root) return null;
      markMatches(root, state.query); const lay = layout(root); const treeId = config.key + ':' + tree.root;
      const box = make('article', 'tree');
      const head = make('div', 'tree-header');
      const left = make('div'); left.append(make('strong', '', tree.rootLabel || tree.root), make('div', 'note', tree.root));
      head.append(left, make('div', 'tree-stats', lay.nodes.length + ' nodes / ' + lay.edges.length + ' edges'));
      const body = make('div', 'tree-body'); const viewport = make('div', 'viewport'), space = make('div', 'zoom-space'), canvas = make('div', 'canvas');
      canvas.style.width = lay.width + 'px'; canvas.style.height = lay.height + 'px';
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'edges'); svg.setAttribute('width', lay.width); svg.setAttribute('height', lay.height); svg.setAttribute('viewBox', '0 0 ' + lay.width + ' ' + lay.height);
      lay.edges.forEach((e) => renderEdge(svg, e)); canvas.append(svg);
      lay.nodes.forEach((n) => canvas.append(renderNode(n, treeId, canvas)));
      space.append(canvas); viewport.append(space); body.append(addZoomTools(treeId, viewport, space, canvas, lay), viewport); box.append(head, body); return box;
    }
    function renderForest(config) {
      const section = make('section', 'forest'); section.dataset.forest = config.key;
      const title = make('div', 'forest-title'); title.append(make('h2', '', config.title), make('span', '', config.note)); section.append(title);
      const trees = config.data.trees || []; if (!trees.length) { section.append(make('div', 'empty', 'No trees available.')); return section; }
      trees.forEach((tree) => { const rendered = renderTree(config, tree); if (rendered) section.append(rendered); }); return section;
    }
    function render() {
      const content = $('content'); content.replaceChildren();
      forestConfigs.filter((c) => state.filter === 'all' || c.key === state.filter).forEach((config) => content.append(renderForest(config)));
    }
    function provenanceImages(node) {
      const f = fullNode(node);
      return (f.provenance || []).map(text).filter((p) => p.startsWith('screenshot:') || p.startsWith('render:')).map((p) => ({ type: p.split(':', 1)[0], path: p.slice(p.indexOf(':') + 1).trim() })).filter((p) => p.path);
    }
    function detailText(value) { return Array.isArray(value) ? value.join('\n') : typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value || ''); }
    function addDetailSection(parent, title, value, className) {
      if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return;
      const section = make('section', 'detail-section' + (className ? ' ' + className : ''));
      section.append(make('h4', '', title), make('p', '', detailText(value)));
      parent.append(section);
    }
    function addRow(grid, key, value) { if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return; grid.append(make('div', 'detail-key', key), make('div', 'detail-value', Array.isArray(value) ? value.join('\\n') : typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value))); }
    function openModal(node, trigger) {
      const f = fullNode(node); const modal = $('modal'), content = $('modalContent'); $('modalTitle').textContent = f.label || node.label || node.instanceId; content.replaceChildren();
      const badges = make('div', 'badges'); [f.kind || node.kind, f.scope || node.scope, f.space || node.space, node.relationToParent, f.interactionType, f.activityType, f.recommendationType, f.expectedOnly ? 'Expected only' : '', isPatch(node) ? 'Patch' : ''].filter(Boolean).forEach((b) => badges.append(make('span', 'badge' + (b === 'Patch' ? ' patch' : ''), b))); content.append(badges);
      const details = make('div', 'detail-sections');
      addDetailSection(details, 'Explanation', f.explanation);
      addDetailSection(details, 'Evidence Summary', f.evidenceSummary);
      addDetailSection(details, 'Reasoning Role', f.reasoningRole);
      addDetailSection(details, 'Patch Rationale', f.patchRationale, 'patch-detail');
      addDetailSection(details, 'Target Context', f.targetContext);
      addDetailSection(details, 'Analytic Contrast', f.analyticContrast);
      addDetailSection(details, 'Decision Criteria', f.decisionCriteria);
      addDetailSection(details, 'Falsification Criteria', f.falsificationCriteria);
      if (details.childNodes.length) content.append(details);
      const imgs = provenanceImages(node); if (imgs.length) { const grid = make('div', 'image-grid'); imgs.forEach(({ path }) => { const fig = document.createElement('figure'); const a = make('a'); a.href = path; a.target = '_blank'; a.rel = 'noopener'; const img = make('img'); img.src = path; img.alt = 'Evidence image for ' + (f.label || node.instanceId); a.append(img); fig.append(a, make('figcaption', '', path)); grid.append(fig); }); content.append(grid); }
      const grid = make('div', 'detail-grid');
      addRow(grid, 'instance', node.instanceId); addRow(grid, 'canonical', node.canonicalId); addRow(grid, 'parent', node.parentInstanceId); addRow(grid, 'relation', node.relationToParent); addRow(grid, 'confidence', f.confidence); addRow(grid, 'salience', f.salience); addRow(grid, 'actor', f.actor); addRow(grid, 'source', f.source); addRow(grid, 'planRef', f.planRef); addRow(grid, 'searchConcepts', f.searchConcepts); addRow(grid, 'provenance', f.provenance); content.append(grid);
      modal.classList.add('open'); modal.dataset.trigger = trigger && trigger.dataset.id || ''; $('modalClose').focus();
    }
    function closeModal() { $('modal').classList.remove('open'); }

    initHeader(); renderSummary(); renderLegends(); render();
    $('search').addEventListener('input', (e) => { state.query = e.target.value.trim().toLowerCase(); render(); });
    $('clearSearch').addEventListener('click', () => { $('search').value = ''; state.query = ''; render(); });
    $('forestFilter').addEventListener('change', (e) => { state.filter = e.target.value; render(); });
    $('modalClose').addEventListener('click', closeModal); $('modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
