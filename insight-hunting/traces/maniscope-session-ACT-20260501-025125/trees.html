<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManiScope Trace Trees</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #64748b;
      --line: #d8e0eb;
      --soft: #eef3f8;
      --accent: #2563eb;
      --green: #168a62;
      --orange: #c76b00;
      --rose: #c2415b;
      --violet: #7257c6;
      --teal: #047481;
      --shadow: 0 8px 22px rgba(31, 41, 55, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 247, 251, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(4, auto);
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    input[type="search"], select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: white;
      color: var(--ink);
      font: inherit;
    }

    button, label.toggle {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    button:hover, label.toggle:hover { border-color: #9fb0c6; }

    main {
      max-width: none;
      margin: 0 auto;
      padding: 22px 24px 44px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }

    .metric .value { font-size: 22px; font-weight: 700; }
    .metric .label { color: var(--muted); font-size: 12px; margin-top: 2px; }

    section.forest {
      margin-top: 22px;
    }

    .forest-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 10px;
    }

    .forest-title h2 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0;
    }

    .forest-title span {
      color: var(--muted);
      font-size: 13px;
    }

    details.tree {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin: 12px 0;
      overflow: clip;
    }

    details.tree > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      background: #fbfdff;
    }

    details.tree > summary::-webkit-details-marker { display: none; }

    .tree-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .tree-heading strong {
      overflow-wrap: anywhere;
    }

    .tree-stats {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tree-body {
      padding: 16px 18px 24px;
      overflow-x: auto;
    }

    .node-wrap {
      position: relative;
      margin: 8px 0;
    }

    .children {
      margin-left: 28px;
      padding-left: 22px;
      border-left: 1px solid var(--line);
    }

    .children > .node-wrap::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 24px;
      width: 22px;
      border-top: 1px solid var(--line);
    }

    .node-card {
      max-width: 900px;
      min-width: 280px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: 8px;
      background: #fff;
      padding: 10px 12px;
    }

    .node-card.match {
      border-color: #f2b84b;
      box-shadow: 0 0 0 3px rgba(242, 184, 75, 0.2);
    }

    body.searching .node-card:not(.match):not(.context) {
      opacity: 0.35;
    }

    .node-top {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .node-title {
      margin-top: 7px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .badge {
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      background: var(--soft);
      color: #334155;
      border: 1px solid transparent;
    }

    .badge.id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .badge.relation { background: #fff7ed; color: #9a4f00; border-color: #fed7aa; }
    .badge.expected { background: #fdf2f8; color: #9f1239; border-color: #fbcfe8; }

    .meta {
      margin-top: 8px;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-row span:first-child {
      color: #475569;
      font-weight: 600;
      margin-right: 4px;
    }

    .toggle-node {
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    .kind-Hypothesis { border-left-color: var(--violet); }
    .kind-Insight { border-left-color: var(--rose); }
    .kind-Finding { border-left-color: var(--green); }
    .kind-AnalyticQuestion { border-left-color: var(--teal); }
    .kind-Task { border-left-color: #64748b; }
    .kind-InvestigationStrategy { border-left-color: var(--orange); }
    .kind-AnalyticActivity { border-left-color: #2563eb; }
    .kind-Interaction { border-left-color: #0f766e; }
    .kind-SourceNode { border-left-color: #475569; }
    .kind-ReasoningGap { border-left-color: #dc2626; }
    .kind-ExpansionRationale { border-left-color: #7c3aed; }
    .kind-RecommendedInteraction { border-left-color: #0891b2; }
    .kind-ExpectedFinding { border-left-color: #db2777; }

    .tree-shell {
      display: block;
    }

    .tree-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin: 0 0 10px;
    }

    .zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .zoom-button {
      width: 32px;
      min-height: 30px;
      justify-content: center;
      padding: 0;
      border-radius: 6px;
      font-weight: 800;
    }

    .zoom-reset {
      width: auto;
      min-width: 44px;
      padding: 0 8px;
      font-size: 12px;
    }

    .zoom-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .zoom-value {
      min-width: 48px;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .graph-viewport {
      min-height: 280px;
      max-height: 72vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(#f8fbff 1px, transparent 1px),
        linear-gradient(90deg, #f8fbff 1px, transparent 1px),
        #ffffff;
      background-size: 28px 28px;
    }

    .graph-zoom-space {
      position: relative;
      min-width: 100%;
      min-height: 280px;
    }

    .graph-canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    .edge-layer {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    .graph-edge {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
      opacity: 0.78;
    }

    .graph-edge.relation-supports { stroke: #16a34a; }
    .graph-edge.relation-produces { stroke: #2563eb; }
    .graph-edge.relation-motivates { stroke: #d97706; }
    .graph-edge.relation-contains { stroke: #64748b; }
    .graph-edge.relation-refines { stroke: #7c3aed; }
    .graph-edge.relation-contradicts { stroke: #dc2626; }
    .graph-edge.relation-derived_from { stroke: #475569; }
    .graph-edge.relation-has_gap { stroke: #dc2626; }
    .graph-edge.relation-addressed_by { stroke: #ea580c; }
    .graph-edge.relation-tested_by { stroke: #7c3aed; }
    .graph-edge.relation-expects { stroke: #db2777; }
    .graph-edge.relation-expands_from { stroke: #9333ea; }
    .graph-edge.relation-has_rationale { stroke: #ca8a04; }

    .graph-node {
      position: absolute;
      width: 240px;
      height: 92px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-top: 5px solid var(--accent);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      padding: 8px 10px 9px;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      display: block;
      white-space: normal;
      overflow: hidden;
    }

    .graph-node:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.13);
    }

    .graph-node.selected {
      outline: 3px solid rgba(37, 99, 235, 0.25);
      border-color: #2563eb;
    }

    .graph-node.match {
      outline: 3px solid rgba(242, 184, 75, 0.35);
      border-color: #d99000;
    }

    body.searching .graph-node:not(.match):not(.context) {
      opacity: 0.25;
    }

    body.searching .graph-edge:not(.match-edge) {
      opacity: 0.15;
    }

    .graph-node .node-id {
      display: inline-flex;
      max-width: 100%;
      border-radius: 999px;
      background: var(--soft);
      padding: 1px 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .graph-node .node-kind {
      margin-left: 4px;
      color: #64748b;
      font-size: 10px;
    }

    .graph-node .node-label {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .graph-node.kind-Hypothesis { border-top-color: #7257c6; background: #faf7ff; }
    .graph-node.kind-Insight { border-top-color: #c2415b; background: #fff7f9; }
    .graph-node.kind-Finding { border-top-color: #168a62; background: #f4fbf8; }
    .graph-node.kind-AnalyticQuestion { border-top-color: #047481; background: #f1fbfd; }
    .graph-node.kind-Task { border-top-color: #64748b; background: #f8fafc; }
    .graph-node.kind-InvestigationStrategy { border-top-color: #c76b00; background: #fff8ed; }
    .graph-node.kind-AnalyticActivity { border-top-color: #2563eb; background: #f4f8ff; }
    .graph-node.kind-Interaction { border-top-color: #0f766e; background: #f2fbf9; }
    .graph-node.kind-SourceNode { border-top-color: #475569; background: #f8fafc; }
    .graph-node.kind-ReasoningGap { border-top-color: #dc2626; background: #fff5f5; }
    .graph-node.kind-ExpansionRationale { border-top-color: #7c3aed; background: #faf7ff; }
    .graph-node.kind-RecommendedInteraction { border-top-color: #0891b2; background: #f1fbfd; }
    .graph-node.kind-ExpectedFinding { border-top-color: #db2777; background: #fff5fb; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(3px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: min(980px, calc(100vw - 48px));
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.28);
      padding: 18px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .modal-eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .modal-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .modal-close {
      width: 36px;
      min-height: 36px;
      justify-content: center;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      border-radius: 999px;
    }

    .modal-content {
      padding-top: 14px;
    }

    .detail-grid {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eef2f7;
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: 0; }

    .detail-key {
      color: #475569;
      font-weight: 700;
    }

    .detail-value {
      color: #1f2937;
      overflow-wrap: anywhere;
    }

    .screenshot-gallery {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .screenshot-heading {
      margin: 0 0 10px;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .screenshot-grid {
      display: grid;
      gap: 14px;
    }

    .screenshot-card {
      margin: 0;
      border: 1px solid #dbe5f0;
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
    }

    .screenshot-link {
      display: block;
      background: #ffffff;
    }

    .screenshot-image {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      background: #ffffff;
    }

    .screenshot-caption {
      padding: 8px 10px;
      color: #64748b;
      font-size: 12px;
      overflow-wrap: anywhere;
      border-top: 1px solid #e2e8f0;
    }

	    .legend {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 8px;
	      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 14px;
      height: 4px;
      border-radius: 999px;
      background: #94a3b8;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
	      background: #94a3b8;
	    }

	    .legend-panel {
	      margin: 0 0 12px;
	      border: 1px solid var(--line);
	      border-radius: 8px;
	      overflow: hidden;
	      background: #ffffff;
	    }

	    .legend-title {
	      margin: 0;
	      padding: 8px 10px;
	      color: #334155;
	      font-size: 12px;
	      font-weight: 800;
	      border-bottom: 1px solid var(--line);
	      background: #f8fafc;
	    }

	    .node-legend-table {
	      width: 100%;
	      border-collapse: collapse;
	      table-layout: fixed;
	      color: #334155;
	      font-size: 12px;
	    }

	    .node-legend-table th,
	    .node-legend-table td {
	      padding: 8px;
	      border: 1px solid #e2e8f0;
	      vertical-align: top;
	    }

	    .node-legend-table thead th {
	      color: #475569;
	      font-weight: 800;
	      background: #f8fafc;
	    }

	    .node-legend-table .scope-heading {
	      width: 82px;
	    }

	    .scope-cell {
	      color: #475569;
	      font-weight: 800;
	      background: #f8fafc;
	    }

	    .node-legend-cell {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 6px;
	      min-height: 28px;
	      align-items: flex-start;
	    }

	    .legend-chip {
	      display: inline-flex;
	      align-items: center;
	      gap: 5px;
	      max-width: 100%;
	      padding: 3px 7px;
	      border: 1px solid #dbe5f0;
	      border-radius: 999px;
	      background: #ffffff;
	      color: #334155;
	      font-size: 12px;
	      font-weight: 700;
	      white-space: nowrap;
	    }

	    .node-legend-empty {
	      color: #94a3b8;
	    }

	    .legend-extra {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 8px;
	      align-items: center;
	      padding: 8px 10px;
	      border-top: 1px solid var(--line);
	      background: #fbfdff;
	    }

	    .legend-extra-title {
	      color: #64748b;
	      font-size: 12px;
	      font-weight: 800;
	    }

	    .empty {
      padding: 18px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: 1fr 1fr; }
      .tree-stats { white-space: normal; }
      details.tree > summary { align-items: flex-start; flex-direction: column; }
      .modal-overlay { padding: 12px; align-items: flex-end; }
      .modal-card { width: 100%; max-height: 82vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>ManiScope Trace Trees</h1>
      <p class="subtitle">Trace: <strong>maniscope-session-ACT-20260501-025125</strong>. This page embeds the generated User Reasoning Forest and Recommendation Plan Forest.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search labels, IDs, evidence, or relation names">
	        <select id="forestFilter" aria-label="Forest filter">
	          <option value="all">All forests</option>
	          <option value="user">User Reasoning Forest</option>
	          <option value="plan">Recommendation Plan Forest</option>
	        </select>
	      </div>
	    </div>
	  </header>

  <main>
    <div id="summary" class="summary"></div>
    <div id="content"></div>
  </main>

  <div id="nodeModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="nodeModalTitle" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <p class="modal-eyebrow">Node details</p>
          <h3 id="nodeModalTitle"></h3>
        </div>
        <button id="nodeModalClose" class="modal-close" type="button" aria-label="Close node details">×</button>
      </div>
      <div id="nodeModalContent" class="modal-content"></div>
    </div>
  </div>

  <script>

      const button = make('button', 'zoom-button' + (extraClass ? ' ' + extraClass : ''), label);
      button.type = 'button';
      button.title = title;
      button.setAttribute('aria-label', title);
      return button;
    }

    function applyTreeZoom(treeId, zoom, parts, options) {
      const opts = options || {};
      const oldZoom = treeZoom(treeId);
      const nextZoom = clampZoom(zoom);
      const viewport = parts.viewport;
      let viewportX = viewport.clientWidth / 2;
      let viewportY = viewport.clientHeight / 2;
      let logicalX = 0;
      let logicalY = 0;

      if (opts.preservePoint) {
        if (Number.isFinite(opts.clientX) && Number.isFinite(opts.clientY)) {
          const rect = viewport.getBoundingClientRect();
          viewportX = opts.clientX - rect.left;
          viewportY = opts.clientY - rect.top;
        }
        logicalX = (viewport.scrollLeft + viewportX) / oldZoom;
        logicalY = (viewport.scrollTop + viewportY) / oldZoom;
      }

      if (opts.store !== false) state.zoomByTree[treeId] = nextZoom;
      parts.zoomSpace.style.width = Math.ceil(parts.layout.width * nextZoom) + 'px';
      parts.zoomSpace.style.height = Math.ceil(parts.layout.height * nextZoom) + 'px';
      parts.canvas.style.transform = `scale(${nextZoom})`;
      parts.label.textContent = formatZoom(nextZoom);
      parts.zoomOut.disabled = nextZoom <= ZOOM_MIN + 0.001;
      parts.zoomIn.disabled = nextZoom >= ZOOM_MAX - 0.001;

      if (opts.preservePoint) {
        viewport.scrollLeft = logicalX * nextZoom - viewportX;
        viewport.scrollTop = logicalY * nextZoom - viewportY;
      }
    }

    function fitTreeZoom(parts) {
      const availableWidth = Math.max(1, parts.viewport.clientWidth - 16);
      const availableHeight = Math.max(1, parts.viewport.clientHeight - 16);
      const widthZoom = availableWidth / parts.layout.width;
      const heightZoom = availableHeight / parts.layout.height;
      const smallerTreeDimensionZoom = parts.layout.width <= parts.layout.height ? widthZoom : heightZoom;
      return clampZoom(Math.min(1, smallerTreeDimensionZoom));
    }

    function scheduleInitialFit(treeId, parts) {
      if (hasStoredZoom(treeId)) return;
      requestAnimationFrame(() => {
        if (hasStoredZoom(treeId) || !parts.viewport.isConnected) return;
        applyTreeZoom(treeId, fitTreeZoom(parts), parts);
      });
    }

    function installGestureZoom(treeId, parts) {
      let gestureStartZoom = treeZoom(treeId);

      parts.viewport.addEventListener('wheel', (event) => {
        if (!event.metaKey && !event.ctrlKey) return;
        event.preventDefault();
        const factor = Math.exp(-event.deltaY * 0.002);
        applyTreeZoom(treeId, treeZoom(treeId) * factor, parts, {
          preservePoint: true,
          clientX: event.clientX,
          clientY: event.clientY
        });
      }, { passive: false });

      parts.viewport.addEventListener('gesturestart', (event) => {
        event.preventDefault();
        gestureStartZoom = treeZoom(treeId);
      }, { passive: false });

      parts.viewport.addEventListener('gesturechange', (event) => {
        event.preventDefault();
        applyTreeZoom(treeId, gestureStartZoom * event.scale, parts, {
          preservePoint: true,
          clientX: event.clientX,
          clientY: event.clientY
        });
      }, { passive: false });
    }

    function renderZoomControls(treeId, viewport, zoomSpace, canvas, layout) {
      const controls = make('div', 'tree-controls');
      const group = make('div', 'zoom-controls');
      const zoomOut = zoomButton('-', 'Zoom out');
      const label = make('span', 'zoom-value');
      const reset = zoomButton('100%', 'Reset zoom', 'zoom-reset');
      const zoomIn = zoomButton('+', 'Zoom in');
      const parts = { viewport, zoomSpace, canvas, layout, label, zoomOut, zoomIn };

      zoomOut.addEventListener('click', () => {
        applyTreeZoom(treeId, treeZoom(treeId) - ZOOM_STEP, parts, { preservePoint: true });
      });
      reset.addEventListener('click', () => {
        applyTreeZoom(treeId, 1, parts, { preservePoint: true });
      });
      zoomIn.addEventListener('click', () => {
        applyTreeZoom(treeId, treeZoom(treeId) + ZOOM_STEP, parts, { preservePoint: true });
      });

      group.append(zoomOut, label, reset, zoomIn);
      controls.append(group);
      installGestureZoom(treeId, parts);
      applyTreeZoom(treeId, treeZoom(treeId), parts, { store: hasStoredZoom(treeId) });
      scheduleInitialFit(treeId, parts);
      return controls;
    }

    function screenshotPaths(node) {
      return (node.provenance || [])
        .map(text)
        .filter((entry) => entry.startsWith('screenshot:'))
        .map((entry) => entry.slice('screenshot:'.length).trim())
        .filter(Boolean);
    }

    function renderScreenshotGallery(node) {
      const paths = screenshotPaths(node);
      if (!paths.length) return null;

      const gallery = make('section', 'screenshot-gallery');
      gallery.append(make('h4', 'screenshot-heading', 'Screenshot evidence'));

      const grid = make('div', 'screenshot-grid');
      for (const path of paths) {
        const figure = make('figure', 'screenshot-card');
        const link = make('a', 'screenshot-link');
        link.href = path;
        link.target = '_blank';
        link.rel = 'noopener';

        const image = make('img', 'screenshot-image');
        image.src = path;
        image.alt = 'Screenshot evidence for ' + text(node.instanceId || node.label || 'node');

        link.append(image);
        figure.append(link);
        figure.append(make('figcaption', 'screenshot-caption', path));
        grid.append(figure);
      }

      gallery.append(grid);
      return gallery;
    }

    function collectStats() {
      const userTrees = DATA.userReasoning.trees || [];
      const planTrees = DATA.recommendationPlan.trees || [];
      const countNodes = (trees) => trees.reduce((sum, tree) => sum + (tree.nodes || []).length, 0);
      return [
        ['User trees', userTrees.length],
        ['User tree nodes', countNodes(userTrees)],
        ['Plan trees', planTrees.length],
        ['Plan tree nodes', countNodes(planTrees)]
      ];
    }

    function renderSummary() {
      const summary = byId('summary');
      summary.replaceChildren();
      for (const item of collectStats()) {
        const card = make('div', 'metric');
        card.append(make('div', 'value', item[1]));
        card.append(make('div', 'label', item[0]));
        summary.append(card);
      }
    }

    function buildTree(tree) {
      const map = new Map();
      for (const node of tree.nodes || []) {
        map.set(node.instanceId, Object.assign({}, node, { children: [] }));
      }
      for (const node of map.values()) {
        if (node.parentInstanceId && map.has(node.parentInstanceId)) {
          map.get(node.parentInstanceId).children.push(node);
        }
      }
      const root = map.get(tree.root) || Array.from(map.values()).find((node) => !node.parentInstanceId) || null;
      return root;
    }

    function nodeSearchText(node) {
      return [
        node.instanceId,
        node.canonicalId,
        node.parentInstanceId,
        node.relationToParent,
        node.kind,
        node.space,
        node.scope,
        node.label,
        node.confidence,
        node.salience,
        node.interactionType,
        node.activityType,
        node.recommendationType,
        node.status,
        node.expectedOnly ? 'expected only' : '',
        (node.provenance || []).join(' ')
      ].map(text).join(' ').toLowerCase();
    }

    function annotateMatches(node, query) {
      const selfMatch = query && nodeSearchText(node).includes(query);
      let descendantMatch = false;
      for (const child of node.children || []) {
        if (annotateMatches(child, query)) descendantMatch = true;
      }
      node.__match = Boolean(selfMatch);
      node.__context = Boolean(query && descendantMatch);
      return selfMatch || descendantMatch;
    }

    function cleanClass(value) {
      return text(value).replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function detailRows(node) {
      const rows = [];
      const add = (name, value, className) => {
        if (value !== null && value !== undefined && value !== '') rows.push([name, value, className || '']);
      };
      add('instance', node.instanceId);
      add('canonical', node.canonicalId);
      add('kind', node.kind);
      add('relation', node.relationToParent);
      add('space', node.space);
      add('scope', node.scope);
      add('confidence', node.confidence);
      add('salience', node.salience);
      add('interaction', node.interactionType);
      add('activity', node.activityType);
      add('recommendation', node.recommendationType);
      add('status', node.status);
      add('source', node.canonicalSourceId || node.sourceNodeId);
      add('target', node.targetNodeId);
      add('evidence', (node.provenance || []).join(' | '), 'evidence-detail');
      return rows;
    }

    function openNodeModal(node, trigger) {
      const modal = byId('nodeModal');
      const title = byId('nodeModalTitle');
      const content = byId('nodeModalContent');
      lastNodeTrigger = trigger || document.activeElement;
      title.textContent = node.label || node.instanceId;
      content.replaceChildren();

      const badges = make('div', 'badges');
      [
        badge(node.kind),
        badge(node.scope),
        badge(node.space),
        badge(node.relationToParent, 'relation'),
        badge(node.expectedOnly ? 'Expected only' : '', 'expected')
      ].filter(Boolean).forEach((el) => badges.append(el));
      content.append(badges);

      const screenshotGallery = renderScreenshotGallery(node);
      if (screenshotGallery) content.append(screenshotGallery);

      const grid = make('div', 'detail-grid');
      for (const [key, value, className] of detailRows(node)) {
        const row = make('div', 'detail-row' + (className ? ' ' + className : ''));
        row.append(make('div', 'detail-key', key));
        row.append(make('div', 'detail-value', value));
        grid.append(row);
      }
      content.append(grid);

      modal.hidden = false;
      modal.classList.add('open');
      byId('nodeModalClose').focus();
    }

    function closeNodeModal() {
      const modal = byId('nodeModal');
      modal.classList.remove('open');
      modal.hidden = true;
      if (lastNodeTrigger && typeof lastNodeTrigger.focus === 'function') {
        lastNodeTrigger.focus();
      }
    }

    function layoutTree(root) {
      const nodes = [];
      const edges = [];
      let leafIndex = 0;
      let maxDepth = 0;

      function walk(node, depth) {
        node.__depth = depth;
        maxDepth = Math.max(maxDepth, depth);
        const children = node.children || [];
        for (const child of children) walk(child, depth + 1);
        if (children.length) {
          node.__y = children.reduce((sum, child) => sum + child.__y, 0) / children.length;
        } else {
          node.__y = MARGIN_Y + leafIndex * ROW_GAP;
          leafIndex += 1;
        }
        node.__x = MARGIN_X + depth * LEVEL_GAP;
        nodes.push(node);
        for (const child of children) {
          edges.push({ source: node, target: child, relation: child.relationToParent || 'contains' });
        }
      }

      walk(root, 0);
      return {
        nodes,
        edges,
        width: MARGIN_X * 2 + maxDepth * LEVEL_GAP + NODE_W,
        height: Math.max(260, MARGIN_Y * 2 + Math.max(leafIndex - 1, 0) * ROW_GAP + NODE_H)
      };
    }

	    function legendChip(kind) {
	      const chip = make('span', 'legend-chip');
	      const dot = make('span', 'legend-dot');
	      dot.style.background = kindColors[kind] || '#94a3b8';
	      chip.append(dot);
	      chip.append(document.createTextNode(kind));
	      return chip;
	    }

	    function nodeLegendPosition(node) {
	      const fallback = kindLegendDefaults[node.kind] || null;
	      const space = node.space || (fallback && fallback.space);
	      const scope = node.scope || (fallback && fallback.scope);
	      if (spaceOrder.includes(space) && scopeOrder.includes(scope)) {
	        return { space, scope };
	      }
	      if (node.kind === 'Finding' && space === 'Finding') {
	        return { space: 'Finding', scope: scopeOrder.includes(scope) ? scope : 'Mid' };
	      }
	      return null;
	    }

	    function renderNodeLegend(nodes) {
	      const panel = make('div', 'legend-panel');
	      panel.append(make('h4', 'legend-title', 'Node legend: Scope x Space'));

	      const table = make('table', 'node-legend-table');
	      const thead = document.createElement('thead');
	      const headerRow = document.createElement('tr');
	      headerRow.append(make('th', 'scope-heading', 'Scope'));
	      for (const space of spaceOrder) headerRow.append(make('th', '', space));
	      thead.append(headerRow);
	      table.append(thead);

	      const cells = new Map();
	      const extras = new Set();
	      for (const node of nodes) {
	        const position = nodeLegendPosition(node);
	        if (position) {
	          const key = `${position.scope}::${position.space}`;
	          if (!cells.has(key)) cells.set(key, new Set());
	          cells.get(key).add(node.kind);
	        } else if (node.kind) {
	          extras.add(node.kind);
	        }
	      }

	      const tbody = document.createElement('tbody');
	      for (const scope of scopeOrder) {
	        const row = document.createElement('tr');
	        row.append(make('th', 'scope-cell', scope));
	        for (const space of spaceOrder) {
	          const cell = document.createElement('td');
	          const wrap = make('div', 'node-legend-cell');
	          const kinds = Array.from(cells.get(`${scope}::${space}`) || []).sort();
	          if (kinds.length) {
	            kinds.forEach((kind) => wrap.append(legendChip(kind)));
	          } else {
	            wrap.append(make('span', 'node-legend-empty', '-'));
	          }
	          cell.append(wrap);
	          row.append(cell);
	        }
	        tbody.append(row);
	      }
	      table.append(tbody);
	      panel.append(table);

	      if (extras.size) {
	        const extra = make('div', 'legend-extra');
	        extra.append(make('span', 'legend-extra-title', 'Plan scaffold'));
	        Array.from(extras).sort().forEach((kind) => extra.append(legendChip(kind)));
	        panel.append(extra);
	      }

	      return panel;
	    }

	    function renderRelationLegend(items) {
	      const legend = make('div', 'legend');
	      for (const item of items) {
	        const entry = make('span', 'legend-item');
	        const swatch = make('span', 'legend-swatch');
	        swatch.style.background = relationColors[item] || '#94a3b8';
	        entry.append(swatch);
	        entry.append(document.createTextNode(item));
	        legend.append(entry);
	      }
	      return legend;
	    }

    function renderEdge(svg, edge) {
      const x1 = edge.source.__x + NODE_W;
      const y1 = edge.source.__y + NODE_H / 2;
      const x2 = edge.target.__x;
      const y2 = edge.target.__y + NODE_H / 2;
      const mid = Math.max(50, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1 + mid} ${y1}, ${x2 - mid} ${y2}, ${x2} ${y2}`);
      path.setAttribute('class', 'graph-edge relation-' + cleanClass(edge.relation));
      if (edge.source.__match || edge.source.__context || edge.target.__match || edge.target.__context) {
        path.classList.add('match-edge');
      }
      svg.append(path);
    }

    function selectNode(treeId, node, canvas, trigger) {
      state.selectedByTree[treeId] = node.instanceId;
      canvas.querySelectorAll('.graph-node.selected').forEach((el) => el.classList.remove('selected'));
      canvas.querySelectorAll('.graph-node').forEach((el) => {
        if (el.dataset.nodeId === node.instanceId) el.classList.add('selected');
      });
      openNodeModal(node, trigger);
    }

    function renderGraphNode(node, treeId, canvas) {
      const button = make('button', 'graph-node kind-' + cleanClass(node.kind));
      button.type = 'button';
      button.dataset.nodeId = node.instanceId;
      button.style.left = node.__x + 'px';
      button.style.top = node.__y + 'px';
      if (node.__match) button.classList.add('match');
      if (node.__context) button.classList.add('context');
      button.append(make('span', 'node-id', node.canonicalId || node.instanceId));
      button.append(make('span', 'node-kind', node.kind || 'node'));
      button.append(make('div', 'node-label', node.label || node.instanceId));
      button.addEventListener('click', (event) => {
        event.preventDefault();
        selectNode(treeId, node, canvas, button);
      });
      return button;
    }

    function renderTree(config, tree) {
      const root = buildTree(tree);
      if (!root) return null;
      annotateMatches(root, state.query);
      const treeId = config.key + ':' + tree.root;
      const layout = layoutTree(root);

      const details = make('details', 'tree');
      details.open = true;
      const summary = make('summary');
      const heading = make('div', 'tree-heading');
      heading.append(badge(tree.root, 'id'));
      heading.append(make('strong', '', tree.rootLabel || tree.root));
      summary.append(heading);
      summary.append(make('div', 'tree-stats', `${layout.nodes.length} nodes · ${layout.edges.length} edges`));
      details.append(summary);

	      const body = make('div', 'tree-body');
	      const relations = Array.from(new Set(layout.edges.map((edge) => edge.relation).filter(Boolean))).sort();
	      body.append(renderNodeLegend(layout.nodes));
	      body.append(renderRelationLegend(relations));

      const shell = make('div', 'tree-shell');
      const viewport = make('div', 'graph-viewport');
      const zoomSpace = make('div', 'graph-zoom-space');
      const canvas = make('div', 'graph-canvas');
      canvas.style.width = layout.width + 'px';
      canvas.style.height = layout.height + 'px';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'edge-layer');
      svg.setAttribute('width', layout.width);
      svg.setAttribute('height', layout.height);
      svg.setAttribute('viewBox', `0 0 ${layout.width} ${layout.height}`);
      layout.edges.forEach((edge) => renderEdge(svg, edge));
      canvas.append(svg);

      const selectedId = state.selectedByTree[treeId];
      layout.nodes.forEach((node) => {
        const renderedNode = renderGraphNode(node, treeId, canvas);
        if (node.instanceId === selectedId) renderedNode.classList.add('selected');
        canvas.append(renderedNode);
      });
      zoomSpace.append(canvas);
      viewport.append(zoomSpace);
      shell.append(renderZoomControls(treeId, viewport, zoomSpace, canvas, layout));
      shell.append(viewport);
      body.append(shell);
      details.append(body);

      return details;
    }

    function renderForest(config) {
      const section = make('section', 'forest');
      section.dataset.forest = config.key;

      const title = make('div', 'forest-title');
      title.append(make('h2', '', config.title));
      title.append(make('span', '', config.note));
      section.append(title);

      const trees = config.data.trees || [];
      if (!trees.length) {
        section.append(make('div', 'empty', 'No trees available.'));
        return section;
      }

      for (const tree of trees) {
        const rendered = renderTree(config, tree);
        if (rendered) section.append(rendered);
      }

      return section;
    }

    function render() {
      document.body.classList.toggle('searching', Boolean(state.query));
      const content = byId('content');
      content.replaceChildren();
      for (const config of forestConfigs) {
        if (state.forestFilter !== 'all' && state.forestFilter !== config.key) continue;
        content.append(renderForest(config));
      }
    }

    byId('search').addEventListener('input', (event) => {
      state.query = event.target.value.trim().toLowerCase();
      render();
    });

    byId('forestFilter').addEventListener('change', (event) => {
      state.forestFilter = event.target.value;
      render();
    });

    byId('nodeModalClose').addEventListener('click', closeNodeModal);

    byId('nodeModal').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) closeNodeModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !byId('nodeModal').hidden) closeNodeModal();
    });

	    renderSummary();
	    render();
  </script>
</body>
</html>
