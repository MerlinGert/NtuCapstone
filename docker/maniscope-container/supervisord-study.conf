[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord-study.pid
user=root

[program:backend]
directory=/workspace/NtuCapstone/front/server
command=/usr/local/bin/uv run uvicorn main:app --host 0.0.0.0 --port 8099
user=maniscope
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/workspace/NtuCapstone/front
command=/usr/sbin/nginx -c /opt/maniscope/nginx-study.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge]
directory=/workspace/NtuCapstone/front
command=/usr/local/bin/bun run codex-bridge
user=maniscope
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
